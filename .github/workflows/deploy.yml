# Deploys app/ to Cloudflare Workers (static assets).
#
# Dormant until the repository sets the variable DEPLOY_APP to "true" and the
# secrets CLOUDFLARE_API_TOKEN (scope: Edit Cloudflare Workers) and
# CLOUDFLARE_ACCOUNT_ID. Gated that way so a fork, or this repo before anyone
# has set it up, does not fail a workflow it cannot possibly complete.
name: deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "react/**", "sdk/**", "theme/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_APP == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tron-paymaster/sdk build
      - run: pnpm --filter @tron-paymaster/react build
      - name: build the app
        # Every VITE_* value is compiled into the public bundle. Nothing
        # secret belongs here; the app holds no keys by design.
        env:
          VITE_TPM_NETWORK: ${{ vars.TPM_NETWORK || 'nile' }}
          VITE_TPM_RELAYER: ${{ vars.TPM_RELAYER }}
          VITE_TPM_FACTORY: ${{ vars.TPM_FACTORY }}
        run: pnpm --filter @tron-paymaster/app build
      - uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          packageManager: pnpm
